<!doctype html>
<html lang="en-us">
  <head>
    <title>Hagemu GameBoy Emulator</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="Hagemu is a gameboy emulator. It runs completely in your browser, has excellent compatibility, supports gamepads, and persistently retains your save data.">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./images/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="./images/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet">
    <style>

      :root {
          --bg-color:   #306657;
          --font-color: #8abd4c;
          --frame-color:#20453A;
      }

      body {
          display: flex;
	  font-family: arial;
	  margin: 0;
	  padding: 0;
	  background-color: var(--bg-color);
	  color: var(--font-color);
          min-height: 100svh;
          justify-content: center;
          align-items: center;
          overflow: hidden;
      }

      a {
          color: inherit;
          text-decoration: none;
      }

      a:hover {
          filter: brightness(0.85);
      }

      button {
          color: inherit;
          background: var(--bg-color);
          border-width: 1.5px;
          border-color: var(--frame-color);
          border-radius: 5px;
          padding: 7px;
          font: inherit;
          cursor: pointer;
          outline: inherit;
          margin: 2px;
          border-style: solid;
          box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
      }

      #left-side {
          display: flex;
          justify-content: space-between;
          flex-direction: column;
          align-items: center;
          align-self: stretch;
          flex: 1;
      }

      #right-side {
          display: flex;
          justify-content: space-between;
          flex-direction: column;
          align-items: center;
          align-self: stretch;
          flex: 1;
      }

      #left-side  { justify-content: flex-start; }
      #right-side { justify-content: flex-end; }

      #cgb-toggle {
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: calc(var(--gb-scale) * 6px);
          padding-left: calc(var(--gb-scale) * 2px);
          padding-right: calc(var(--gb-scale) * 2px);
          margin: calc(var(--gb-scale) * 10px);
          border-radius: 5px;
      }

      #toggle-label-left {
          text-align: right;
          width: calc(var(--gb-scale) * 15px);
      }

      #toggle-label-right {
          text-align: left;
          width: calc(var(--gb-scale) * 15px);
      }

      .toggle {
          position: relative;
          display: inline-block;
          width:  calc(var(--gb-scale) * 15px);
          height: calc(var(--gb-scale) * 8.5px);
          margin: calc(var(--gb-scale) * 2px);
      }

      .toggle input {
          display: none;
      }

      .slider {
          position: absolute;
          cursor: pointer;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          transition: 0.4s;
          border-radius: 34px;
          background-color: var(--font-color);
      }

      .slider:before {
          position: absolute;
          content: "";
          height: calc(var(--gb-scale) * 6.5px);
          width: calc(var(--gb-scale) * 6.5px);
          left: calc(var(--gb-scale) * 1px);
          bottom: calc(var(--gb-scale) * 1px);
          background-color: #FFF;
          transition: 0.4s;
          border-radius: 50%;
      }

      /* input:checked + .slider { */
      /*     background-color: #606; */
      /* } */

      input:checked + .slider:before {
          transform: translateX(calc(var(--gb-scale) * 6.5px));
      }

      button:hover {
          filter: brightness(0.85);
      }

      <!-- /* the canvas *must not* have any border or padding, or mouse coords will be wrong */ -->
      #canvas {
          display: block;
          outline: none;
          border-radius: 5px;
          margin: 0;
          padding: 0;
          background-color: var(--frame-color);
      }

      #logo {
          font-size: calc(var(--gb-scale) * 6px);
	  font-family: "Courier New", monospace;
	  font-weight: bold;
	  text-align: center;
      }

      #under-logo {
          font-size: calc(var(--gb-scale) * 3px);
          vertical-align: middle;
          white-space: nowrap;
          text-align: center;
	  font-family: "Courier New", monospace;
	  font-weight: bold;
	  text-align: center;
          padding-top: 5px;
      }

      #status {
          display: inline-block;
          vertical-align: top;
          margin-top: 0px;
          margin-left: 0px;
          display: none;
          font-weight: bold;
          color: rgb(120, 120, 120);
      }

      #terminal-output {
          position: absolute;
          display: none;
          border-radius: 5px;
          box-sizing: border-box;
          width: calc(var(--gb-scale) * 160px);
          height: calc(var(--gb-scale) * 144px);
          font-size: calc(var(--gb-scale) * 6px);
          aspect-ratio: 160 / 144;
          border: 0;
          padding: 5px;
          background-color: black;
          color: white;
          font-family: 'Lucida Console', Monaco, monospace;
          resize: none;
          z-index: 1;
      }

      #overlay {
          display: flex;
          position: absolute;
          align-items: center;
          justify-content: center;
          text-align: center;
          font-family: 'Press Start 2P';
          font-size: calc(var(--gb-scale) * 6px);
          padding: calc(var(--gb-scale) * 4px);
	  background-color: var(--font-color);
	  color: var(--bg-color);
          border-radius: 5px;
          inset: 0;
          pointer-events: none;
          line-height: 2;
      }

      #content {
          display: flex;
          flex-direction: row;
          justify-content: space-between;
          align-items: center;
          min-width: 100svw;
      }

      #frame {
          background-color: var(--frame-color);
          border: 15px var(--frame-color) solid;
          border-radius: 15px;
      }

      #dpad {
          margin: auto;
          padding: calc(var(--gb-scale) * 8px);
          gap: calc(var(--gb-scale) * 3px);
          display: grid;
          grid-template-areas:
            ".    up    ."
            "left .     right"
            ".    down  .";
          grid-template-columns: 1fr 1fr 1fr;
          grid-template-rows: 1fr 1fr 1fr;
      }

      #face-buttons {
          margin: auto;
          padding: calc(var(--gb-scale) * 8px);
          gap: calc(var(--gb-scale) * 3px);
          display: grid;
          grid-template-areas:
            ". a"
            "b .";
          grid-template-columns: 1fr 1fr;
      }

      #special-buttons {
          padding: calc(var(--gb-scale) * 8px);
          gap: calc(var(--gb-scale) * 3px);
          display: grid;
          grid-template-areas:
            "select gbstart";
          grid-template-columns: 1fr 1fr;
      }

      .face-btn {
          font-size: calc(var(--gb-scale) * 8px);
          height: calc(var(--gb-scale) * 24px);
          width: calc(var(--gb-scale) * 24px);
          font-weight: bold;
      }

      .dpad-btn {
          height: calc(var(--gb-scale) * 24px);
          width: calc(var(--gb-scale) * 24px);
      }

      .special-btn {
          font-size: calc(var(--gb-scale) * 4px);
          height: calc(var(--gb-scale) * 24px);
          width: calc(var(--gb-scale) * 24px);
          font-weight: bold;
      }

      #btn-up    { grid-area: up; }
      #btn-left  { grid-area: left; }
      #btn-right { grid-area: right; }
      #btn-down  { grid-area: down; }

      #btn-a { grid-area: a; }
      #btn-b { grid-area: b; }
      #btn-start  { grid-area: gbstart; }
      #btn-select { grid-area: select; }

      .arrow {
          border: solid var(--font-color);
          border-width: 0 5px 5px 0;
          display: inline-block;
          padding: calc(var(--gb-scale) * 2px);
      }

      .arrow-right { transform: rotate(-45deg); }
      .arrow-left { transform: rotate(135deg); }
      .arrow-up { transform: rotate(-135deg); }
      .arrow-down { transform: rotate(45deg); }
    </style>
  </head>
  <body>
    <div id="content">

      <div id="left-side">
        <div id='spinner'></div>
        <div id="status"></div>
        <progress value="0" max="100" id="progress" hidden=1></progress>
        <div id="dpad">
          <button class="gpad-btn dpad-btn" id="btn-up">
            <i class="arrow arrow-up"></i>
          </button>
          <button class="gpad-btn dpad-btn" id="btn-left">
            <i class="arrow arrow-left"></i>
          </button>
          <button class="gpad-btn dpad-btn" id="btn-right">
            <i class="arrow arrow-right"></i>
          </button>
          <button class="gpad-btn dpad-btn" id="btn-down">
            <i class="arrow arrow-down"></i>
          </button>
        </div>
        <div id="cgb-toggle">
          <span class="toggle-label" id="toggle-label-left">GB</span>
          <label class="toggle">
            <input type="checkbox">
            <span class="slider"></span>
          </label>
          <span class="toggle-label" id="toggle-label-right">GBC</span>
        </div>
      </div>

      <div id="frame">
        <textarea readonly id="terminal-output"></textarea>
        <div style="position: relative; display: inline-block;">
          <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
          <div id="overlay"> </div>
        </div>
        <div id="logo">
          <a href="https://github.com/brennier/hagemu">Hagemu GameBoy Emulator</a>
        </div>
        <div id="under-logo">
          <label style="cursor:pointer;">
            <button onclick="triggerRomUpload()">Upload ROM</button>
            <input type="file" accept=".gb,.gbc" id="romFileInput" style="display:none" />
          </label>
          <label style="cursor:pointer;">
            <button onclick="triggerSaveUpload()">Upload Save</button>
            <input type="file" accept=".sav,.sram" id="saveFileInput" style="display:none" />
          </label>
          <button onclick="downloadSRAM()">Download Save</button>
          <button id="terminal-button">Show Terminal</button>
          <button onclick="resetROM()">Reset ROM</button>
        </div>
      </div>

      <div id="right-side">
        <div id="face-buttons">
          <button class="gpad-btn face-btn" id="btn-a">A</button>
          <button class="gpad-btn face-btn" id="btn-b">B</button>
        </div>
        <div id="special-buttons">
          <button class="gpad-btn special-btn" id="btn-start">START</button>
          <button class="gpad-btn special-btn" id="btn-select">SELECT</button>
        </div>
      </div>

    </div>

    <script type='text/javascript'>
      // Map button IDs to your WASM function arguments
      const buttonMap = {
          'btn-right':  0,
          'btn-left':   1,
          'btn-up':     2,
          'btn-down':   3,
          'btn-a':      4,
          'btn-b':      5,
          'btn-start':  6,
          'btn-select': 7,
      };

      function bindButton(id, buttonIndex) {
          const el = document.getElementById(id);

          // Touch (mobile)
          el.addEventListener('touchstart', (e) => {
              e.preventDefault();
              Module._web_set_button(buttonIndex);
          }, { passive: false }); // passive:false is required to allow preventDefault

          el.addEventListener('touchend', (e) => {
              e.preventDefault();
              Module._web_unset_button(buttonIndex);
          }, { passive: false });

          // Mouse (desktop fallback)
          el.addEventListener('mousedown', () => Module._web_set_button(buttonIndex));
          el.addEventListener('mouseup',   () => Module._web_unset_button(buttonIndex));
          el.addEventListener('mouseleave',() => Module._web_unset_button(buttonIndex)); // in case cursor leaves while held
      }

      function waitForGesture() {
          return new Promise(resolve => {
              const events = ['click', 'pointerdown'];
              var canvas = document.getElementById('canvas');
              const handler = () => {
                  events.forEach(e => canvas.removeEventListener(e, handler));
                  resolve();
              };

              events.forEach(e => canvas.addEventListener(e, handler));
          });
      }

      async function myConfirm(prompt) {
          const audioCtx = Module.SDL3.audioContext;
          await audioCtx.suspend();
          const confirmed = confirm(prompt);
          await audioCtx.resume();
          return confirmed;
      }

      async function resetROM() {
          if (!Module._web_is_rom_running()) {
              return;
          }
          Module._web_save_sram_file();
          const confirmed = await myConfirm("Are you sure you want to reset the game?");
          if (confirmed) {
              Module._web_rom_reset(is_cgb_mode);
          }
      }

      let is_cgb_mode = false;

      const toggle = document.querySelector('#cgb-toggle input');
      toggle.addEventListener('change', async () => {
          Module._web_save_sram_file();
          const is_running = Module._web_is_rom_running();
          let should_continue = true;

          if (is_running) {
              should_continue = await myConfirm("Switching between Game Boy and Game Boy Color mode will reset the current game. Any unsaved progress will be lost. Continue?");
          }

          if (should_continue) {
              is_cgb_mode = toggle.checked;
              if (is_running)
                  Module._web_rom_reset(is_cgb_mode);
              const bg_color    = is_cgb_mode ? "#505068" : "#306657";
              const font_color  = is_cgb_mode ? "#adadad" : "#8abd4c";
              const frame_color = is_cgb_mode ? "#303030" : "#20453a";
              document.documentElement.style.setProperty('--bg-color', bg_color);
              document.documentElement.style.setProperty('--font-color', font_color);
              document.documentElement.style.setProperty('--frame-color', frame_color);
          } else {
              toggle.checked = !toggle.checked;
          }
      });

      async function downloadFileFromParam() {
          // 1. Read the "url" query parameter
          const proxyUrl = "https://fetch.barennier.workers.dev/";
          const params = new URLSearchParams(window.location.search);
          const targetUrl = params.get("rom");
          var overlay = document.getElementById('overlay');

          if (!targetUrl) {
              overlay.textContent = "No ROM file loaded. Click the \"Upload ROM\" button below to get started.";
              throw new Error(`No "rom" query parameter found.`);
              return;
          }

          const ext = targetUrl.split(".").pop().toLowerCase();
          if (ext === "gb") {
              toggle.checked = false;
              toggle.dispatchEvent(new Event('change'));
          } else if (ext === "gbc") {
              toggle.checked = true;
              toggle.dispatchEvent(new Event('change'));
          } else {
              throw new Error(`Unsupported file type ".${ext}". Only gb and gbc files are allowed.`);
          }

          overlay.textContent = "A ROM file was found in the URL. Click here to download and run it.";
          await waitForGesture();
          overlay.textContent = "Loading ROM file...";

          // Always load for at least one second
          const [response] = await Promise.all([
              fetch(`${proxyUrl}?url=${encodeURIComponent(targetUrl)}`),
              new Promise(res => setTimeout(res, 1000))
          ]);

          if (!response.ok) {
              throw new Error(`Fetch failed: ${response.status} ${response.statusText}`);
          }

          // 3. Read the response body as an ArrayBuffer, then wrap in Uint8Array
          const buffer = await response.arrayBuffer();
          const byteArray = new Uint8Array(buffer);

          console.log(`Downloaded ${byteArray.length} bytes from: ${targetUrl}`);

          FS.mkdir("/fetched");
          const safeName = targetUrl.split("/").pop().replace(/[^a-zA-Z0-9._-]/g, "_");
          const path = "/fetched/" + safeName;

          // Write file into virtual FS
          FS.writeFile(path, byteArray);

          Module.ccall("web_load_rom", null, ["string", "boolean"], [path, is_cgb_mode]);

          // Reset so the same file can be uploaded
          event.target.value = "";

          await new Promise(r => setTimeout(r, 100));

          overlay.style.display = 'none';

          return byteArray;
      }

      function web_setup_filesystem() {
	  FS.mkdir('/savedata');
	  FS.mount(IDBFS, {}, '/savedata');
	  FS.syncfs(true, function (err) {
	      if (err) {
		  console.log("Error loading the offline database");
	      } else {
		  console.log("Successfully loaded the offline database");
	      }
	  });
      }

      window.addEventListener("beforeunload", function (event) {
          Module._web_save_sram_file();
	  FS.syncfs(false, function (err) {
	      if (err) {
		  console.log("Error writing to the offline database");
	      } else {
		  console.log("Successfully wrote to the offline database");
	      }
	  });
      });

      function triggerRomUpload() {
          document.getElementById("romFileInput").click();
      }

      function triggerSaveUpload() {
          document.getElementById("saveFileInput").click();
      }

      document.getElementById("saveFileInput").addEventListener("change", uploadFile);
      document.getElementById("romFileInput").addEventListener("change", uploadFile);

      async function uploadFile(event) {
          const file = event.target.files[0];
          if (!file) return;

          try {
              const buffer = await file.arrayBuffer();
              const data = new Uint8Array(buffer);

              const ext = file.name.split(".").pop().toLowerCase();
              var type;
              if (ext == "gb" || ext == "gbc") {
                  type = "rom";
              } else if (ext == "sav" || ext == "sram") {
                  type = "sram";
              } else {
                  throw new Error(`Unsupported file type ".${ext}"`);
              }

              var overlay = document.getElementById('overlay');
              overlay.textContent = "Loading ROM file...";

              // FS.mkdir("/tmp");
              const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
              const path = "/tmp/" + safeName;

              // Write file into virtual FS
              FS.writeFile(path, data);

              if (type == "sram") {
                  Module.ccall("web_load_sram", null, ["string"], [path]);
              } else {
                  Module.ccall("web_load_rom", null, ["string", "boolean"], [path, is_cgb_mode]);
              }

              await new Promise(r => setTimeout(r, 100));

              overlay.style.display = 'none';
          } catch (err) {
              console.error(err);
              alert("Failed to load file.");
          } finally {
              // Reset so the same file can be uploaded
              event.target.value = "";
          }
      }

      function downloadSRAM() {
          const ptr          = Module._web_get_sram_pointer();
          const size         = Module._web_get_sram_size();
          const filename_ptr = Module._web_get_sram_file_name();
          const filename     = Module.UTF8ToString(filename_ptr);

          if (!ptr || size <= 0) {
              alert("No save data available to download.");
              return;
          }

          // Copy from WASM heap
          const data = new Uint8Array(Module.HEAPU8.buffer, ptr, size);

          // IMPORTANT: copy it out (avoid referencing live WASM memory)
          const copy = new Uint8Array(data);

          // Create file
          const blob = new Blob([copy], { type: "application/octet-stream" });

          // Create download link
          const url = URL.createObjectURL(blob);

          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();

          // Cleanup
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
      }

      function resizeCanvas() {
          var content = document.getElementById('content');
          var frame = document.getElementById('frame');
          let scale = 0;

          const el = document.createElement('div');
          el.style.cssText = 'position:absolute;visibility:hidden;height:100svh;width:100svw';
          document.body.appendChild(el);
          const small_viewport = el.getBoundingClientRect();
          document.body.removeChild(el);

          if (small_viewport.width * 1.25 > small_viewport.height) {
              content.style.flexWrap = 'nowrap';
              content.style.height = '';
              content.style.width = '100svw';
              frame.style.order = '';
              frame.style.margin = '';
              scale = Math.min(
                  small_viewport.width / 360, // 30px for the border
                  (0.9 * small_viewport.height - 50) / 144 // 50px for the border + padding
              );
              content.style.height = '';
          } else {
              content.style.flexWrap = 'wrap';
              content.style.height = '100svh';
              content.style.width = '';
              frame.style.order = '-1';
              frame.style.margin = '0 auto';
              scale = Math.min(
                  (small_viewport.width - 50) / 160, // 30px for the border
                  (0.50 * small_viewport.height - 50) / 144 // 50px for the border + padding
              );
          }

          // scale = Math.max(scale, 2.0);
          canvas.style.width  = (160 * scale) + 'px';
          canvas.style.height = (144 * scale) + 'px';

          document.documentElement.style.setProperty('--gb-scale', scale);
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      var button = document.getElementById('terminal-button');
      button.onclick = function() {
          var div = document.getElementById('terminal-output');
          if (div.style.display == 'flex') {
              div.style.display = 'none';
          }
          else {
              div.style.display = 'flex';
          }
      };

      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('terminal-output');
      if (outputElement) outputElement.value = ''; // clear browser cache

      // As a default initial behavior, pop up an alert when webgl context is lost. To make your
      // application robust, you may want to override this behavior before shipping!
      // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
      canvasElement.addEventListener('webglcontextlost', (e) => {
          alert('WebGL context lost. You will need to reload the page.');
          e.preventDefault();
      }, false);

      var Module = {
          onRuntimeInitialized: function() {
              web_setup_filesystem();
              downloadFileFromParam().catch(err => {
                  console.error("downloadFileFromParam failed:", err);
              });
              // Bind all buttons once WASM is ready
              for (const [id, index] of Object.entries(buttonMap)) {
                  bindButton(id, index);
              }
              resizeCanvas();
          },
          print(...args) {
              console.log(...args);
              if (outputElement) {
                  var text = args.join(' ');
                  outputElement.value += text + "\n";
                  outputElement.scrollTop = outputElement.scrollHeight; // focus on bottom
              }
          },
          canvas: canvasElement,
          setStatus(text) {
              Module.setStatus.last ??= { time: Date.now(), text: '' };
              if (text === Module.setStatus.last.text) return;
              var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
              var now = Date.now();
              // if this is a progress update, skip it if too soon
              if (m && now - Module.setStatus.last.time < 30) return;
              Module.setStatus.last.time = now;
              Module.setStatus.last.text = text;
              if (m) {
                  text = m[1];
                  progressElement.value = parseInt(m[2])*100;
                  progressElement.max = parseInt(m[4])*100;
                  progressElement.hidden = false;
                  spinnerElement.hidden = false;
              } else {
                  progressElement.value = null;
                  progressElement.max = null;
                  progressElement.hidden = true;
                  if (!text) spinnerElement.style.display = 'none';
              }
              statusElement.innerHTML = text;
          },
          totalDependencies: 0,
          monitorRunDependencies(left) {
              this.totalDependencies = Math.max(this.totalDependencies, left);
              Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
          }
      };
      Module.setStatus('Downloading...');
      window.onerror = (event) => {
          // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
          Module.setStatus('Exception thrown, see JavaScript console');
          spinnerElement.style.display = 'none';
          Module.setStatus = (text) => {
              if (text) console.error('[post-exception status] ' + text);
          };
      };
    </script>
    <script async type="text/javascript" src="hagemu.js"></script>
  </body>
</html>
